<!doctype html>
<html lang="en-US">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Text:ital@0;1&display=swap" rel="stylesheet">
    <link href="../styles/style.css" rel="stylesheet" />
    <script src="../href_motion.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        MathJax = {
            tex: {
                inlineMath: [["$", "$"]]
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

    <title>Home Page</title>
</head>

<body style="width: 80%;">

    <nav class="outer_links">
        <ol>
            <li class="outer_link"><a class="scale_bigger" href="https://github.com/liudesheng9/" target="top"
                    rel="noopener">Github</a></li>
            <li class="outer_link"><a class="scale_bigger" href="../personal_space.html" target="top">Personal Space</a>
            </li>
            <li class="outer_link"><a class="scale_bigger" href="../sub_pages/blog_subpage.html" target="top">My
                    Blogs</a></li>
        </ol>
    </nav>
    <div id="content"></div>
    <script>
        // const files = ['Company_utility_function_with_2_interventions.md', 'Note_20241120.md'];
        const files = ['Debt_overhang.md'];
        const md_root_floder = '../markdown/';
        // for each md name, add the root folder
        files.forEach((file, index) => {
            files[index] = md_root_floder + file;
        });
        const contentDiv = document.getElementById('content');

        files.forEach(file => {
            fetch(file)
                .then(response => {
                    if (!response.ok) {
                        alert(`Error ${response.status}: ${response.statusText}`);
                        console.error(`Error ${response.status}: ${response.statusText}`);
                        throw new Error(`Could not load ${file}`);
                    }
                    // alert(`Success ${response.status}`);
                    return response.text();
                })
                .then(markdown => {
                    // alert(markdown);
                    const div = document.createElement('div');
                    div.classList.add('markdown-content');
                    div.innerHTML = marked.parse(markdown); // Convert Markdown to HTML
                    contentDiv.appendChild(div);
                    MathJax.typeset();
                })
                .then(() => {
                    MathJax.typeset();
                })
                .catch(error => console.error(error));
        });
    </script>
</body>

</html>
